<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo app</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #111; }
    h1 { font-size: 22px; }
    button { margin: 4px 6px 4px 0; padding: 8px 12px; cursor: pointer; }
    pre { background: #f4f4f5; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Demo app</h1>
  <p>A plain Express app. Use these buttons to exercise the routes, then add Autter Runtime by following the README.</p>

  <button data-call="/api/ok">OK request</button>
  <button data-call="/api/users/42">User route</button>
  <button data-call="/api/slow">Slow request</button>
  <button data-call="/api/flaky">Flaky request</button>
  <button data-call="/api/boom">Server bug (500)</button>
  <button data-call="/api/checkout?declined=1" method="POST">Checkout 402</button>
  <button data-call="/api/checkout?sku=ABC" method="POST">Checkout 409</button>

  <h2>Result</h2>
  <pre id="out">Click a button.</pre>

  <script>
    const out = document.getElementById("out");
    document.querySelectorAll("button[data-call]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const path = btn.dataset.call;
        const method = btn.getAttribute("method") || "GET";
        try {
          const res = await fetch(path, { method, headers: { "content-type": "application/json" }, body: method === "POST" ? "{}" : undefined });
          out.textContent = `${method} ${path} -> ${res.status}\n${await res.text()}`;
        } catch (err) {
          out.textContent = `${method} ${path} failed\n${err}`;
        }
      });
    });
  </script>
</body>
</html>
